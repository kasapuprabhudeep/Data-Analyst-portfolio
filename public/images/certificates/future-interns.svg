<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="emeraldBorder" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="520" rx="12" fill="none" stroke="url(#emeraldBorder)" stroke-width="2" opacity="0.6"/>
  <rect x="30" y="30" width="740" height="500" rx="8" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Corner Decors -->
  <circle cx="30" cy="30" r="4" fill="#34D399"/>
  <circle cx="770" cy="30" r="4" fill="#34D399"/>
  <circle cx="30" cy="530" r="4" fill="#34D399"/>
  <circle cx="770" cy="530" r="4" fill="#34D399"/>

  <!-- Top Badge -->
  <text x="400" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#34D399" letter-spacing="4">FUTURE INTERNS SUMMER PROGRAM</text>
  <text x="400" y="155" text-anchor="middle" font-family="Inter, Georgia, serif" font-size="30" font-weight="800" fill="#FFFFFF">Certificate of Internship</text>

  <text x="400" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">This certificate is proudly presented to</text>

  <!-- Recipient Name -->
  <text x="400" y="255" text-anchor="middle" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="#34D399" letter-spacing="1">Kasapu Prabhudeep</text>
  <line x1="220" y1="270" x2="580" y2="270" stroke="#34D399" stroke-width="1.5" opacity="0.4"/>

  <!-- Role text -->
  <text x="400" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">in recognition of valuable contributions and successful completion of the internship as</text>
  <text x="400" y="348" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Data Science &amp; Analytics Intern</text>

  <!-- Duration & Deliverables -->
  <text x="400" y="388" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">Duration: May 2026 – July 2026 • Virtual Internship</text>
  <text x="400" y="415" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B">Key Projects: FUTURE_DS_01 (Exploratory Analytics) &amp; FUTURE_DS_02 (Trend Analysis)</text>

  <!-- Seal / Organization Info -->
  <g transform="translate(130, 445)">
    <circle cx="25" cy="25" r="22" fill="#065F46" opacity="0.4"/>
    <circle cx="25" cy="25" r="18" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <text x="25" y="29" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#34D399">OFFICIAL</text>
    <text x="60" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#F1F5F9">Future Interns</text>
    <text x="60" y="36" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Data Analytics Track</text>
  </g>

  <!-- Verification Link -->
  <g transform="translate(540, 445)">
    <text x="0" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#F1F5F9">Status</text>
    <text x="0" y="36" font-family="JetBrains Mono, monospace" font-size="10" fill="#34D399">Verified Completion</text>
  </g>
</svg>

