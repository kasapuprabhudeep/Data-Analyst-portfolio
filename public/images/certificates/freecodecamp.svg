<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="520" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="2" opacity="0.6"/>
  <rect x="30" y="30" width="740" height="500" rx="8" fill="none" stroke="#1E293B" stroke-width="1"/>

  <!-- Corner Decors -->
  <circle cx="30" cy="30" r="4" fill="#38BDF8"/>
  <circle cx="770" cy="30" r="4" fill="#38BDF8"/>
  <circle cx="30" cy="530" r="4" fill="#38BDF8"/>
  <circle cx="770" cy="530" r="4" fill="#38BDF8"/>

  <!-- freeCodeCamp Logo / Flame -->
  <g transform="translate(370, 55) scale(1.3)">
    <path d="M12 2c0 0-8 6-8 13 0 4.418 3.582 8 8 8s8-3.582 8-8c0-7-8-13-8-13zm0 18c-2.76 0-5-2.24-5-5 0-3 3-6.5 5-8.5 2 2 5 5.5 5 8.5 0 2.76-2.24 5-5 5z" fill="#38BDF8"/>
    <path d="M12 9c-1 1.5-2 3-2 4.5 0 1.1.9 2 2 2s2-.9 2-2c0-1.5-1-3-2-4.5z" fill="#22D3EE"/>
  </g>

  <!-- Headers -->
  <text x="400" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="4">FREECODECAMP VERIFIED CREDENTIAL</text>
  <text x="400" y="170" text-anchor="middle" font-family="Inter, Georgia, serif" font-size="30" font-weight="800" fill="#FFFFFF">Certificate of Achievement</text>

  <text x="400" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8">This is to certify that</text>

  <!-- Recipient Name -->
  <text x="400" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="#38BDF8" letter-spacing="1">Kasapu Prabhudeep</text>
  <line x1="220" y1="285" x2="580" y2="285" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>

  <!-- Course text -->
  <text x="400" y="325" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">has successfully completed the developer curriculum and requirements for</text>
  <text x="400" y="365" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Data Analysis with Python</text>

  <!-- Topics -->
  <text x="400" y="405" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B">NumPy • Pandas • Matplotlib • Seaborn • Data Cleaning • Exploratory Data Analysis</text>

  <!-- Seal / Badge -->
  <g transform="translate(130, 440)">
    <circle cx="25" cy="25" r="22" fill="#0369A1" opacity="0.4"/>
    <circle cx="25" cy="25" r="18" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="25" y="29" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38BDF8">VERIFIED</text>
    <text x="60" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#F1F5F9">freeCodeCamp.org</text>
    <text x="60" y="36" font-family="Inter, sans-serif" font-size="10" fill="#64748B">300 Hours Curriculum</text>
  </g>

  <!-- Verification Link -->
  <g transform="translate(520, 440)">
    <text x="0" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#F1F5F9">Credential ID</text>
    <text x="0" y="36" font-family="JetBrains Mono, monospace" font-size="10" fill="#38BDF8">data-analysis-with-python-v7</text>
